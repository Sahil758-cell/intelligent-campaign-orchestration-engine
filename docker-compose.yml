version: "3.9"

services:
  campaign-engine:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      # Cerebras free-tier key (primary). Regenerate at cloud.cerebras.ai if expired.
      - CEREBRAS_API_KEY=csk-2vtyn56fv3v3fwnwx4twjnev8eypepk8mje5h532t8mv2jxj
      # Groq free-tier fallback. Set GROQ_API_KEY env var or get key at console.groq.com
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
    volumes:
      # Mount outputs/ so generated files are accessible on the host
      - ./outputs:/app/outputs
    command: >
      sh -c "
        echo '=== Stage 1: Ingest ===' &&
        python -m src.pipeline --stage ingest &&
        echo '=== Stage 2: Detect ===' &&
        python -m src.pipeline --stage detect &&
        echo '=== Running Full Pipeline ===' &&
        python -m src.pipeline &&
        echo '=== Running Tests ===' &&
        python -m pytest tests/ -q --tb=short --cov=src --cov-report=term-missing &&
        echo '=== Done. Outputs in /app/outputs ==='
      "
